# Replace portfolio.example.com and certificate paths. Configure TLS first.
server {
  listen 80;
  server_name portfolio.example.com;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl;
  server_name portfolio.example.com;
  ssl_certificate /etc/letsencrypt/live/portfolio.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/portfolio.example.com/privkey.pem;
  client_max_body_size 11m;
  add_header Strict-Transport-Security "max-age=31536000" always;
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Overwrite untrusted client headers; TRUST_PROXY=true relies on this.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
  }
}
